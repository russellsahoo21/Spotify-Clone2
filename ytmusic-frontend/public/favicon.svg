<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Premium Gradient -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF0055" />
      <stop offset="50%" stop-color="#7A00FF" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Circle (Sleek dark finish) -->
  <circle cx="256" cy="256" r="240" fill="#09090b" stroke="url(#neonGrad)" stroke-width="12" />

  <!-- Music Wave/Note Icon (Premium layout) -->
  <g filter="url(#neonGlow)">
    <!-- Play Triangle -->
    <path d="M210 160 l140 96 -140 96 z" fill="url(#neonGrad)" />
    
    <!-- Glowing Accent Circles/Soundwaves -->
    <path d="M370 200 A80 80 0 0 1 370 312" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" />
    <path d="M410 160 A130 130 0 0 1 410 352" fill="none" stroke="url(#neonGrad)" stroke-width="14" stroke-linecap="round" />
  </g>
</svg>